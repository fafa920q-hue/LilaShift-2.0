# Apply the P1 fix-1 patch (one-shot)
#
# Manually dispatched once, on the feature/lila-p1-20261114 branch: applies
# lilashift-p1-fix1.patch (fix 1: make ChangeValue conform to Hashable so
# Set(entries.map(\.value)) in GestaltX/DependencyAnalyzer.swift:256 compiles)
# on top of the branch HEAD and commits the result to the current branch.
# Do NOT re-run after the patch is applied; git apply --check fails when
# the changes are already in the tree, and the run stops before committing.
name: Apply P1 fix-1 patch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply the patch and verify localizations
        run: |
          git apply --check lilashift-p1-fix1.patch
          git apply lilashift-p1-fix1.patch
          python3 -X utf8 scripts/generate_localization.py
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py

      - name: Commit the applied fix
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fix P1 compile error: make ChangeValue Hashable (CI: Run Swift Tests #95)"
          git push
