# Apply the modified-values-fix patch (eSIM flags under CachedOptionsOriginal.flags).
#
# One-shot workflow: applies lilashift-modified-values-fix.patch, regenerates
# localization and notices, runs the localization and third-party-notices tests,
# then commits and pushes the result back to this branch.
#
# Usage: run it from the Actions tab on the branch that holds the patch file.
# Delete the patch file and this workflow after a successful run.

name: Apply modified-values-fix patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Apply patch
        run: |
          git apply --check lilashift-modified-values-fix.patch
          git apply lilashift-modified-values-fix.patch
      - name: Regenerate localization and notices
        run: |
          python3 scripts/generate_localization.py
          python3 tests/LocalizationTests.py
          python3 tests/ThirdPartyNoticesTests.py
      - name: Commit and push
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git add -A
          git commit -m "Fix Modified Values compile error: eSIM flags live under CachedOptionsOriginal.flags" || exit 0
          git push
