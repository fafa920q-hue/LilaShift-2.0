# Delete test-target scaffolding (one-shot)
#
# Manually dispatched once, on the dev/p0-security-fixes branch: removes
# test-target-delta.patch and this workflow file itself in a single commit,
# after the delta patch has been applied and run-swift-tests.yml added.
name: Delete test-target scaffolding
on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Delete scaffolding files and push
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git rm test-target-delta.patch .github/workflows/apply-test-target-delta.yml
          git status --short
          git commit -m "Delete test-target scaffolding"
          git push























