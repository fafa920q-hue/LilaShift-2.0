# Apply the Modified Values fix-2 delta patch (one-shot)
#
# Manually dispatched once, on the dev/region-fix-only branch: applies
# lilashift-modified-values-fix2.patch (fix the ModifiedValuesTests compile
# error: tests/ModifiedValuesTests.swift:41 references GestaltKeys.siriKey,
# which does not exist; replaced with the siriOnDevice key literal) on top of
# the branch HEAD and commits the result to the current branch. Do NOT re-run
# after the patch is applied: git apply --check fails when the changes
# are already in the tree, and the run stops before committing.
name: Apply Modified Values fix-2 patch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply the delta patch and verify localizations
        run: |
          git apply --check lilashift-modified-values-fix2.patch
          git apply lilashift-modified-values-fix2.patch
          python3 -X utf8 scripts/generate_localization.py
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py

      - name: Commit the applied delta
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fix Modified Values test compile error: use the siriOnDevice key literal"
          git push
