# Apply the Lila core modules fix3 patch (one-shot)
#
# Manually dispatched once, on the feature/lila-core-modules-20261114
# branch: applies lilashift-core-modules-fix3.patch (FIX for the
# 8 runtime assertion failures in Run Swift Tests #91: fail-closed
# .unknown on nil layout, device-identity keys productType and
# modelNumber, and Boolean true (not NSNumber 1) for AI keys)
# on top of the branch HEAD and commits the result to the current
# branch. No assertion changed, no test deleted, no test file touched.
# Do NOT re-run: git apply --check fails once the patch is applied.
name: Apply core modules fix3 patch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Apply the core modules fix3 patch and verify localizations
        run: |
          git apply --check lilashift-core-modules-fix3.patch
          git apply lilashift-core-modules-fix3.patch
          python3 -X utf8 scripts/generate_localization.py
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py
      - name: Commit the applied patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "FIX: core modules fix3 - fail-closed layout, device identity, Boolean AI keys"
          git push
