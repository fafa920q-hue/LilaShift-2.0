# Apply the test-target fix-round-3 delta patch (one-shot)
#
# Manually dispatched once, on the dev/p0-security-fixes branch: applies
# test-target-fix-round3.patch (fix round 3: hoist await out of XCTAssert
# autoclosures, add missing try) on top of the branch HEAD and commits the
# result to the current branch. Do NOT re-run after the patch is applied:
# git apply --check fails when the changes are already in the tree, and
# the run stops before committing.
name: Apply test-target fix-round-3 patch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply the delta patch and verify localizations
        run: |
          git apply --check test-target-fix-round3.patch
          git apply test-target-fix-round3.patch
          python3 -X utf8 scripts/generate_localization.py
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py

      - name: Commit the applied delta
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fix round-3 test-target build errors (CI: Run Swift Tests #20)

          Hoist await out of XCTAssert/XCTAssertThrowsError autoclosures
          (32 sites, 11 files); XCTAssertThrowsError sites became do/catch
          with XCTFail on the no-throw path, error-handler assertions
          preserved. Add missing try (9 sites, including try before whole
          && expressions). No test logic or assertions changed; app source
          untouched. 9-item one-tap preset unchanged; #178 decision still
          pending."
          git push







































