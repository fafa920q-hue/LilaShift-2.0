name: Apply modified-values patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Apply patch
        run: |
          git apply --check lilashift-modified-values.patch
          git apply lilashift-modified-values.patch
      - name: Regenerate localization and run Python tests
        run: |
          python3 -X utf8 scripts/generate_localization.py
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py
      - name: Commit and push
        run: |
          git config user.name fafa920q-hue
          git config user.email fafa920q-hue@users.noreply.github.com
          git add -A
          git commit -m "Add read-only Modified Values report" || echo "nothing to commit"
          git push
