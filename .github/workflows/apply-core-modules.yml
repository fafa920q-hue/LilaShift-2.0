# Apply the Lila core modules patch (one-shot)
#
# Manually dispatched once, on the feature/lila-core-modules-20261114
# branch: applies lilashift-core-modules.patch (P0 original core
# modules: Lila Intelligence, SafePatch, Restore Intelligence) on top
# of dev/region-fix-only @ 20b573f and commits the result to the
# current branch. Logic + read-only only: the real write path is NOT
# wired. Do NOT re-run after the patch is applied: git apply --check
# fails when the changes are already in the tree, and the run stops
# before committing.
name: Apply core modules patch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Apply the core modules patch and verify localizations
        run: |
          git apply --check lilashift-core-modules.patch
          git apply lilashift-core-modules.patch
          python3 -X utf8 scripts/generate_localization.py
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py
      - name: Commit the applied patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "P0 原创核心模块：紫序智能引擎 + SafePatch + Restore Intelligence（仅逻辑与只读，先不连真实写入）"
          git push
