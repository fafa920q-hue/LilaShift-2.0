# Apply the P3 FIX2 patch (one-shot)
#
# Manually dispatched once, on feature/lila-p3-20261114: applies
# lilashift-p3-fix2.patch (PresetCatalog.swift:518/649/723: three
# properties 'chineseContent', 'chineseContentDeviceAndAdvanced'
# and 'mergedChineseContent' -> 'fileprivate', fixing the three
# "uses a fileprivate type" errors from Run Swift Tests #105) and
# commits the result to the current branch. Do NOT re-run after the patch is applied.
# git apply --check fails when the changes are already in the tree.
name: Apply P3 FIX2 patch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply the patch and verify localizations
        run: |
          git apply --check lilashift-p3-fix2.patch
          git apply lilashift-p3-fix2.patch
          python3 -X utf8 scripts/generate_localization.py
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py

      - name: Commit the applied fix
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Fix P3 PresetContent properties access level (internal -> fileprivate)"
          git push
