# 一次性流程：套用 Lila App Appearance 補丁。
# 僅在 feature/lila-app-appearance-discovery-20261114 分支上手動觸發一次，
# 將根目錄的 lilashift-appearance-delta.patch 套用到 PR #3 的分支上，
# 重新產生在地化檔案並執行 Python 測試，成功後提交並推送。
# 完成後請刪除補丁檔與本流程檔（鷹架），切勿重複執行。
name: Apply appearance delta patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-appearance-delta:
    runs-on: ubuntu-latest
    steps:
      - name: 取出分支程式碼
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: 檢查並套用補丁
        run: |
          ls -l lilashift-appearance-delta.patch
          git apply --check lilashift-appearance-delta.patch
          git apply lilashift-appearance-delta.patch
      - name: 重新產生在地化檔案
        run: python3 -X utf8 scripts/generate_localization.py
      - name: 執行 Python 測試
        run: |
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py
      - name: 提交並推送
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          git status --short
          git diff --stat
          git add -A
          git commit -m "完成 Lila App Appearance 預覽模組（僅預覽）" -m "新增 GestaltX/AppAppearance.swift 與 GestaltX/AppAppearanceViews.swift：圖示大小與格式驗證、PNG/JPEG/HEIC 匯入、自訂裁切、圓角預覽、名稱編輯、載入失敗提示、復原歷程、本地草稿儲存（SHA-256 摘要），並明確區隔僅預覽 UI。" -m "擴充測試與在地化字串（610 個鍵 x 10 語言）。本模組僅供預覽：不碰觸目標 App、LaunchServices、SpringBoard 或 IconServices；原生寫入已硬性停用。"
          git push origin HEAD:feature/lila-app-appearance-discovery-20261114
