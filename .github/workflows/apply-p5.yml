# Apply the P5 patch (one-shot) — SPLIT version for re-transport
#
# Manually dispatched once, on feature/lila-p5-20261114: applies
# lilashift-p5.patch (P5 non-workflow files only) on top of the
# branch HEAD and commits the result to the current branch.
# Do NOT re-run after the patch is applied: git apply --check
# fails when the changes are already in the tree, and the run
# stops before committing.
#
# SPLIT: the three .github/workflows/* files from P5
# (swiftlint.yml, prepare-release.yml, run-swift-tests.yml)
# are created directly on the branch via the web editor FIRST,
# because the GITHUB_TOKEN cannot push workflow files.
# This workflow therefore applies only the REDUCED patch
# (10 non-workflow files) and pushes it with `contents: write`.
# There is NO `workflows` permission in workflow YAML —
# GitHub rejects it as an unexpected value.
#
# The commit step removes __pycache__ / *.pyc before staging —
# PrepareReleaseTests.py generates scripts/__pycache__/ when it
# runs, and the first transport accidentally committed the .pyc.
name: Apply P5 patch
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Apply the P5 patch and verify localizations
        run: |
          git apply --check lilashift-p5.patch
          git apply lilashift-p5.patch
          python3 -X utf8 scripts/generate_localization.py
          python3 -X utf8 tests/LocalizationTests.py
          python3 -X utf8 tests/ThirdPartyNoticesTests.py
          python3 -X utf8 tests/PrepareReleaseTests.py

      - name: Commit the applied patch
        run: |
          git config user.name "fafa920q-hue"
          git config user.email "fafa920q-hue@users.noreply.github.com"
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true
          git add -A
          git status --short
          git commit -m "P5: SwiftUI snapshot tests + SwiftLint + release system"
          git push
